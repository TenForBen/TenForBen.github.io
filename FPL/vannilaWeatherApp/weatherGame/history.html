<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link
    rel="stylesheet"
    href="https://stackpath.bootstrapcdn.com/bootswatch/4.4.1/minty/bootstrap.min.css"
  />
  <title>Run History — TENFORBEN Station</title>
  <link
    rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text x=%228%22 y=%2213%22 font-size=%2214%22 text-anchor=%22middle%22>%F0%9F%A6%96</text></svg>"
  />
  <style>
    body {
      background: #060a14;
      color: #cfe8ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }

    .gs-header {
      background: linear-gradient(180deg, #0a1226 0%, #060a14 100%);
      border-bottom: 1px solid #1b2a4a;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .gs-brand {
      font-family: "Courier New", Courier, monospace;
      letter-spacing: 1px;
      font-size: 1rem;
      color: #7dd3fc;
    }
    .gs-back-link {
      font-family: "Courier New", Courier, monospace;
      color: #93a4c3;
      font-size: 0.85rem;
      text-decoration: none;
    }
    .gs-back-link:hover { color: #7dd3fc; text-decoration: underline; }

    main.container {
      padding-top: 28px;
      padding-bottom: 60px;
      max-width: 760px;
    }

    h1 {
      font-family: "Courier New", Courier, monospace;
      font-size: 1.4rem;
      color: #e2ecff;
      text-align: center;
      margin-bottom: 6px;
    }
    .gs-status {
      text-align: center;
      color: #6b7fa8;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.85rem;
      margin-bottom: 4px;
    }
    .gs-copy-uid {
      text-align: center;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.75rem;
      margin-bottom: 28px;
    }
    .gs-copy-uid a { color: #6b7fa8; }
    .gs-copy-uid a:hover { color: #7dd3fc; }

    .gs-history-tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 28px;
    }
    .gs-tab-btn {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
      color: #93a4c3;
      background: transparent;
      border: 1px solid #1b2a4a;
      border-radius: 4px;
      padding: 6px 14px;
      cursor: pointer;
    }
    .gs-tab-btn:hover { color: #7dd3fc; border-color: #1f6feb; }
    .gs-tab-btn.gs-tab-active { color: #060a14; background: #7dd3fc; border-color: #7dd3fc; }

    h2.gs-section-title {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #6b7fa8;
      margin: 32px 0 14px;
    }

    /* ---- run cards ---- */
    .gs-run-card {
      background: #0c1630;
      border: 1px solid #1b2a4a;
      border-radius: 8px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .gs-run-card-best {
      border-color: #f0b429;
      box-shadow: 0 0 0 1px #f0b429;
    }
    .gs-run-header-row {
      display: flex;
      align-items: stretch;
    }
    .gs-run-toggle {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 14px;
      background: transparent;
      border: none;
      color: inherit;
      text-align: left;
      padding: 14px 18px;
      cursor: pointer;
      font-family: inherit;
    }
    .gs-run-toggle:hover { background: #101c3c; }
    .gs-run-export-btn {
      flex: 0 0 auto;
      background: transparent;
      border: none;
      border-left: 1px solid #1b2a4a;
      color: #6b7fa8;
      font-size: 0.95rem;
      padding: 0 16px;
      cursor: pointer;
    }
    .gs-run-export-btn:hover { color: #7dd3fc; background: #101c3c; }
    .gs-run-streak {
      font-family: "Courier New", Courier, monospace;
      font-size: 1.4rem;
      font-weight: bold;
      color: #7dd3fc;
      min-width: 2.4em;
    }
    .gs-run-card-best .gs-run-streak { color: #f0b429; }
    .gs-run-meta {
      flex: 1 1 auto;
      font-size: 0.85rem;
      color: #9db4de;
    }
    .gs-run-caret {
      color: #6b7fa8;
      font-size: 0.8rem;
    }
    .gs-run-detail {
      border-top: 1px solid #1b2a4a;
      padding: 4px 18px 14px;
      overflow-x: auto;
    }

    .gs-round-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      margin-top: 10px;
    }
    .gs-round-table th {
      text-align: left;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.68rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #6b7fa8;
      padding: 6px 10px 6px 0;
      border-bottom: 1px solid #1b2a4a;
    }
    .gs-round-table td {
      padding: 7px 10px 7px 0;
      border-bottom: 1px solid #101a30;
      white-space: nowrap;
    }
    .gs-round-table tbody tr:last-child td { border-bottom: none; }

    .gs-badge {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.7rem;
      font-weight: bold;
      letter-spacing: 0.5px;
      padding: 2px 7px;
      border-radius: 3px;
      border: 1px solid currentColor;
    }
    .gs-badge-correct { color: #16a34a; }
    .gs-badge-incorrect { color: #dc2626; }
    .gs-badge-timeout { color: #f0b429; }

    /* How close a reading landed to the threshold it was judged against,
       independent of correct/incorrect — exactly at the threshold (gold)
       or within 2 degrees of it (green). See tempClosenessClass() in
       historyPage.js. */
    .gs-temp-gold { color: #f0b429; font-weight: bold; }
    .gs-temp-green { color: #16a34a; font-weight: bold; }

    .gs-empty-note {
      text-align: center;
      color: #6b7fa8;
      font-size: 0.9rem;
      padding: 30px 0;
    }
    .gs-empty-note a { color: #7dd3fc; }

    /* Printing (or "Save as PDF", the same browser feature) gets its own
       light, ink-friendly theme rather than the dark console look — a
       dark background either wastes a page of ink or, worse, prints as
       invisible white-on-white if the browser's "background graphics"
       option is off. Everything below only applies inside a print
       context; the on-screen page is untouched. */
    @media print {
      body { background: #fff; color: #14213d; }
      .gs-header, .gs-run-caret, .gs-run-export-btn { display: none; }
      .gs-copy-uid, .gs-history-tabs { display: none !important; }
      h1, .gs-status, h2.gs-section-title { color: #14213d; }
      .gs-run-card, .gs-run-card-best {
        background: #fff;
        border: 1px solid #ccc;
        box-shadow: none;
        break-inside: avoid;
      }
      .gs-run-toggle { cursor: default; }
      .gs-run-streak { color: #14213d; }
      .gs-run-card-best .gs-run-streak { color: #b45309; }
      .gs-run-meta { color: #555; }
      .gs-run-detail { display: block !important; border-top-color: #ddd; }
      .gs-round-table th { color: #666; border-bottom-color: #ccc; }
      .gs-round-table td { color: #14213d; border-bottom-color: #eee; }
      .gs-badge-correct { color: #15803d; }
      .gs-badge-incorrect { color: #b91c1c; }
      .gs-badge-timeout { color: #b45309; }
      .gs-temp-gold { color: #b45309; }
      .gs-temp-green { color: #15803d; }

      /* Set on <body> by a per-run "export this run" click (see
         wireExportButtons in historyPage.js) — hides every OTHER run card
         so the PDF contains just the one the player asked for, not the
         whole page. */
      body.gs-printing-one .gs-run-card:not(.gs-print-target) { display: none; }
      body.gs-printing-one h2.gs-section-title { display: none; }
    }
  </style>
</head>
<body>
  <header class="gs-header">
    <div class="gs-brand">TENFORBEN // STATION — Run History</div>
    <a class="gs-back-link" href="geoStreakGame.html">&larr; GeoStreak</a>
  </header>

  <main class="container">
    <h1>Your Run History</h1>
    <p class="gs-status" id="hStatus">Loading&hellip;</p>
    <p class="gs-copy-uid"><a href="#" id="hCopyUid" style="display: none;">Copy my player ID</a></p>

    <!-- Which game's runs to show — always visible, unlike the Master-only
         tabs below. GeoStreak first since it's the older/default game. -->
    <div class="gs-history-tabs" id="hGameTabs">
      <button type="button" id="hGameGeo" class="gs-tab-btn gs-tab-active">GeoStreak</button>
      <button type="button" id="hGameTimeQuiz" class="gs-tab-btn">Time Quiz</button>
    </div>

    <!-- Master accounts only (see MASTER_UIDS in historyPage.js) — hidden
         for everyone else, since it wouldn't work for them anyway:
         firestore.rules' isMaster() is the real gate. -->
    <div class="gs-history-tabs" id="hTabs" style="display: none;">
      <button type="button" id="hTabMine" class="gs-tab-btn gs-tab-active">My Runs</button>
      <button type="button" id="hTabAll" class="gs-tab-btn">All Players</button>
    </div>

    <div id="hBestSection">
      <h2 class="gs-section-title" id="hBestTitle">🏆 Personal Best</h2>
      <div id="hBest"></div>
    </div>

    <h2 class="gs-section-title" id="hListTitle">All Runs</h2>
    <div id="hList"></div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore-compat.js"></script>
  <script src="firebaseConfig.js"></script>
  <script src="historyPage.js"></script>
</body>
</html>
