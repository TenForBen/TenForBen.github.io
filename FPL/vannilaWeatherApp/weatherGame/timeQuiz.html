<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link
    rel="stylesheet"
    href="https://stackpath.bootstrapcdn.com/bootswatch/4.4.1/minty/bootstrap.min.css"
  />
  <title>Time Quiz — TENFORBEN Station</title>
  <link
    rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text x=%228%22 y=%2213%22 font-size=%2214%22 text-anchor=%22middle%22>%E2%8F%B1%EF%B8%8F</text></svg>"
  />
  <style>
    body {
      background: #060a14;
      color: #cfe8ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }

    .tq-header {
      background: linear-gradient(180deg, #0a1226 0%, #060a14 100%);
      border-bottom: 1px solid #1b2a4a;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .tq-brand {
      font-family: "Courier New", Courier, monospace;
      letter-spacing: 1px;
      font-size: 1rem;
      color: #7dd3fc;
    }
    .tq-back-link {
      font-family: "Courier New", Courier, monospace;
      color: #93a4c3;
      font-size: 0.85rem;
      text-decoration: none;
    }
    .tq-back-link:hover { color: #7dd3fc; text-decoration: underline; }
    .tq-header-links {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .tq-header-nickname-wrap {
      display: flex;
      align-items: center;
      gap: 7px;
      padding-right: 4px;
      border-right: 1px solid #1b2a4a;
      margin-right: 2px;
    }
    .tq-header-nickname {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.85rem;
      font-weight: bold;
      color: #f0b429;
    }

    main.tq-main {
      max-width: 520px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }

    .tq-panel {
      background: #0c1630;
      border: 1px solid #1b2a4a;
      border-radius: 10px;
      padding: 24px 22px;
      text-align: center;
    }
    .tq-panel h3 {
      font-family: "Courier New", Courier, monospace;
      color: #7dd3fc;
      margin-bottom: 10px;
    }
    .tq-panel-sub {
      color: #9db4de;
      margin-bottom: 18px;
    }
    .tq-nickname {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
      color: #6b7fa8;
      margin: -4px 0 14px;
    }
    .tq-howto {
      text-align: left;
      color: #93a4c3;
      font-size: 0.85rem;
      margin: 18px 0 0;
      padding-left: 20px;
    }
    .tq-howto li { margin-bottom: 6px; }
    .tq-best {
      font-family: "Courier New", Courier, monospace;
      color: #6b7fa8;
      font-size: 0.8rem;
      margin-top: 14px;
    }

    .tq-region-picker {
      background: #0a1226;
      border: 1px solid #1b2a4a;
      border-radius: 8px;
      padding: 14px 16px;
      margin: 4px 0 18px;
      text-align: left;
    }
    .tq-region-picker-label {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.7rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #6b7fa8;
      margin: 0 0 10px;
    }
    /* One row per STAGES entry — cleared (checkmark), current (arrow), or
       still locked (padlock), so the whole campaign's shape is visible at
       a glance. Replaces an earlier version's multi-select checkbox grid,
       now that exactly one stage is ever active at a time. */
    .tq-stage-roadmap {
      list-style: none;
      padding: 0;
      margin: 0 0 10px;
    }
    .tq-stage-roadmap li {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
      padding: 3px 0;
    }
    .tq-stage-icon { width: 1.2em; text-align: center; flex-shrink: 0; }
    .tq-stage-cleared { color: #4ade80; }
    .tq-stage-current { color: #7dd3fc; font-weight: bold; }
    .tq-stage-locked { color: #6b7fa8; }
    .tq-region-locked-note {
      color: #9db4de;
      font-size: 0.82rem;
      margin: 0;
      line-height: 1.5;
    }
    .tq-unlock-note {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.85rem;
      color: #f0b429;
      margin: 8px 0 0;
    }

    /* ---- Question screen ---- */
    .tq-progress {
      text-align: center;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.8rem;
      color: #6b7fa8;
      margin-bottom: 10px;
    }
    .tq-score-live {
      text-align: center;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.75rem;
      color: #7dd3fc;
      margin-bottom: 14px;
    }
    .tq-timer {
      text-align: center;
      font-family: "Courier New", Courier, monospace;
      font-size: 2.4rem;
      font-weight: bold;
      color: #7dd3fc;
      margin-bottom: 6px;
      font-variant-numeric: tabular-nums;
    }
    .tq-timer.tq-timer-warn { color: #f0b429; }
    .tq-timer.tq-timer-danger { color: #f87171; }

    /* Wraps the question-screen timer + Quit button side by side — the
       gap-screen countdown (#tqGapTimer) reuses .tq-timer standalone, not
       inside this row, so its own centering/margin is untouched. */
    .tq-timer-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 0;
    }
    .tq-timer-row .tq-timer { margin-bottom: 0; }
    /* Deliberately muted, same idea as GeoStreak's own .gs-pause-btn — not
       something to reach for without meaning to — but with a red hover
       instead of blue, since this one ends the quiz rather than just
       pausing it. */
    .tq-quit-btn {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.75rem;
      letter-spacing: 1px;
      color: #93a4c3;
      background: transparent;
      border: 1px solid #1b2a4a;
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
    }
    .tq-quit-btn:hover { color: #f87171; border-color: #f87171; }
    .tq-points-preview {
      text-align: center;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.85rem;
      color: #6b7fa8;
      margin: 0 0 14px;
      font-variant-numeric: tabular-nums;
    }
    .tq-points-preview.tq-timer-warn { color: #f0b429; }
    .tq-points-preview.tq-timer-danger { color: #f87171; }
    .tq-timer-bar-wrap {
      height: 6px;
      background: #101c3c;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 22px;
    }
    .tq-timer-bar {
      height: 100%;
      background: linear-gradient(90deg, #7dd3fc, #f0b429, #f87171);
      transition: width 0.03s linear;
    }
    .tq-condition {
      background: #0c1630;
      border: 1px solid #1b2a4a;
      border-radius: 10px;
      padding: 22px;
      text-align: center;
      margin-bottom: 18px;
    }
    .tq-region-badge {
      display: inline-block;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.7rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #7dd3fc;
      background: #101c3c;
      border: 1px solid #1b2a4a;
      border-radius: 20px;
      padding: 4px 12px;
      margin-bottom: 12px;
    }
    .tq-condition-text {
      font-size: 1.3rem;
      color: #e2ecff;
      font-weight: 600;
    }
    .tq-input-row {
      display: flex;
      gap: 8px;
    }
    .tq-hint {
      min-height: 1.4em;
      text-align: center;
      font-size: 0.85rem;
      color: #f0b429;
      margin-top: 8px;
    }

    /* ---- Per-question result overlay ---- */
    .tq-result-panel {
      background: #0c1630;
      border: 1px solid #1b2a4a;
      border-radius: 10px;
      padding: 26px 22px;
      text-align: center;
    }
    .tq-result-badge {
      font-family: "Courier New", Courier, monospace;
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 1px;
      padding: 6px 16px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 14px;
    }
    .tq-result-correct { color: #4ade80; border: 1px solid #4ade80; }
    .tq-result-wrong { color: #f87171; border: 1px solid #f87171; }
    .tq-result-detail {
      color: #9db4de;
      margin-bottom: 4px;
    }
    .tq-result-details {
      text-align: left;
      background: #0a1226;
      border: 1px solid #1b2a4a;
      border-radius: 8px;
      padding: 4px 14px;
      margin: 12px 0;
    }
    .tq-result-detail-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 7px 0;
      border-bottom: 1px dashed #16213f;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.8rem;
    }
    .tq-result-detail-row:last-child { border-bottom: none; }
    .tq-result-detail-label {
      color: #6b7fa8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-size: 0.68rem;
      white-space: nowrap;
    }
    .tq-result-detail-value {
      color: #7dd3fc;
      text-align: right;
    }
    .tq-result-detail-value a { color: #7dd3fc; }
    .tq-result-points {
      font-family: "Courier New", Courier, monospace;
      font-size: 2rem;
      font-weight: bold;
      color: #7dd3fc;
      margin: 10px 0;
    }
    .tq-result-total {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.85rem;
      color: #6b7fa8;
      margin-bottom: 18px;
    }
    .tq-next-note {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.75rem;
      color: #6b7fa8;
      margin-top: 12px;
    }

    /* Same shape as geoStreakGame.html's .gs-tally-chip / .gs-tally-popover
       — a hoverable/focusable "flag CODE ×N" chip that expands a small
       popover listing the actual cities. */
    .tq-tally {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.85rem;
      color: #9db4de;
      margin: 4px 0 0;
    }
    .tq-tally-chip {
      position: relative;
      cursor: default;
      border-bottom: 1px dotted #4a5f8f;
      outline: none;
    }
    .tq-tally-popover {
      display: none;
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: #0f1830;
      border: 1px solid #2c3d63;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.8rem;
      line-height: 1.5;
      color: #cfe0ff;
      white-space: nowrap;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      z-index: 10;
    }
    .tq-tally-chip:hover .tq-tally-popover,
    .tq-tally-chip:focus .tq-tally-popover {
      display: block;
    }

    /* ---- Final screen ---- */
    .tq-final-score {
      font-family: "Courier New", Courier, monospace;
      font-size: 3rem;
      font-weight: bold;
      color: #7dd3fc;
      margin: 6px 0;
    }
    .tq-final-sub {
      color: #9db4de;
      margin-bottom: 20px;
    }
    .tq-breakdown {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.78rem;
      margin-top: 18px;
      text-align: left;
    }
    .tq-breakdown th {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.65rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #6b7fa8;
      padding: 6px 8px 6px 0;
      border-bottom: 1px solid #1b2a4a;
    }
    .tq-breakdown td {
      padding: 7px 8px 7px 0;
      border-bottom: 1px solid #101a30;
      color: #cfe8ff;
    }
    .tq-breakdown tr:last-child td { border-bottom: none; }
    .tq-row-correct { color: #4ade80 !important; }
    .tq-row-wrong { color: #f87171 !important; }
    /* How close a reading landed to the threshold it was judged against,
       independent of correct/incorrect — same idea (and same colors) as
       GeoStreak's own .gs-temp-gold/.gs-temp-green in history.html.
       Exactly at the threshold is gold; within 2 degrees either side is
       green. See tempClosenessClass() in timeQuiz.js. */
    .tq-temp-gold { color: #f0b429; font-weight: bold; }
    .tq-temp-green { color: #16a34a; font-weight: bold; }
    /* The gap screen's growing "questions so far" recap — same table
       styling as .tq-breakdown, just its own top spacing since it sits
       inside the result panel rather than the final screen. */
    .tq-recap-title {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.7rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #6b7fa8;
      text-align: left;
      margin: 18px 0 0;
    }
    .tq-recap-table { margin-top: 6px; }
    .tq-final-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 22px;
    }

    /* ---- Nickname row ("Playing as ___ [Save]") — static markup, see
       timeQuizLeaderboard.js's wireNicknameInput(). Same layout as the
       question screen's .tq-input-row, just its own top label. ---- */
    .tq-player-bar {
      max-width: 420px;
      margin: 0 auto 18px;
      text-align: left;
    }
    .tq-player-label {
      display: block;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.7rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #6b7fa8;
      margin-bottom: 6px;
    }

    /* ---- Leaderboard / Best-10 panel — same shape as GeoStreak's own
       .gs-leaderboard-* rules in geoStreakGame.html, duplicated here with
       a tq- prefix per this page's self-contained-CSS convention (see
       .tq-tally-chip vs .gs-tally-chip above). ---- */
    .tq-leaderboard-list {
      list-style: none;
      padding: 0;
      margin: 0;
      text-align: left;
    }
    .tq-leaderboard-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      padding: 5px 4px;
      border-bottom: 1px solid #1b2a4a;
    }
    .tq-leaderboard-list li:last-child { border-bottom: none; }
    .tq-leaderboard-list li.tq-leaderboard-me {
      background: #12244a;
      border-radius: 4px;
    }
    .tq-leaderboard-rank {
      font-family: "Courier New", Courier, monospace;
      color: #6b7fa8;
      width: 2.2em;
      text-align: right;
      flex-shrink: 0;
    }
    .tq-leaderboard-name {
      color: #cfe8ff;
      flex: 1 1 auto;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tq-leaderboard-streak {
      font-family: "Courier New", Courier, monospace;
      color: #7dd3fc;
      font-weight: bold;
    }
    .tq-leaderboard-runs,
    .tq-leaderboard-correct,
    .tq-leaderboard-avg {
      font-family: "Courier New", Courier, monospace;
      color: #6b7fa8;
      font-size: 0.75rem;
      width: 2.6em;
      text-align: right;
      flex-shrink: 0;
    }
    .tq-leaderboard-header-list { margin-bottom: 2px; }
    .tq-leaderboard-header-row {
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-size: 0.7rem !important;
      color: #6b7fa8;
      font-weight: bold;
    }
    .tq-leaderboard-header-row .tq-leaderboard-name { color: #6b7fa8; }
    .tq-leaderboard-note {
      color: #6b7fa8;
      font-size: 0.85rem;
      font-style: italic;
    }

    .tq-lb-pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 12px;
    }
    .tq-page-btn {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
      color: #93a4c3;
      background: transparent;
      border: 1px solid #1b2a4a;
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
    }
    .tq-page-btn:hover:not(:disabled) { color: #7dd3fc; border-color: #1f6feb; }
    .tq-page-btn:disabled { color: #40506e; cursor: not-allowed; }
    .tq-page-label {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.75rem;
      color: #6b7fa8;
    }

    .tq-leaderboard-tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .tq-tab-btn {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
      color: #93a4c3;
      background: transparent;
      border: 1px solid #1b2a4a;
      border-radius: 4px;
      padding: 5px 14px;
      cursor: pointer;
    }
    .tq-tab-btn:hover { color: #7dd3fc; border-color: #1f6feb; }
    .tq-tab-btn.tq-tab-active {
      color: #7dd3fc;
      border-color: #7dd3fc;
      background: #12244a;
    }

    /* ---- Insights (Most Used Cities/Countries) — same list shape as
       GeoStreak's .gs-city-list, side by side in two columns. ---- */
    .tq-insights-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      text-align: left;
      margin: 4px 0 0;
    }
    .tq-insight-col { flex: 1 1 160px; min-width: 0; }
    .tq-insight-label {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.6rem;
      letter-spacing: 1.5px;
      color: #6b7fa8;
      margin: 0 0 6px;
    }
    .tq-city-list {
      list-style: none;
      padding: 0;
      margin: 0;
      text-align: left;
    }
    .tq-city-list li {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.8rem;
      padding: 3px 4px;
      border-bottom: 1px solid #1b2a4a;
    }
    .tq-city-list li:last-child { border-bottom: none; }
    .tq-city-name { color: #cfe8ff; }
    .tq-city-count {
      font-family: "Courier New", Courier, monospace;
      color: #7dd3fc;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <header class="tq-header">
    <div class="tq-brand">TENFORBEN // STATION — Time Quiz</div>
    <div class="tq-header-links">
      <!-- Shown once a nickname has been saved (see
           timeQuizLeaderboard.js's showHeaderDisplay()); until then
           #tqPlayerBar below handles the first save. Same toggle
           GeoStreak's own geoStreakGame.html header uses. -->
      <span id="tqHeaderNicknameWrap" class="tq-header-nickname-wrap" style="display: none;">
        <span id="tqHeaderNickname" class="tq-header-nickname"></span>
        <a href="#" id="tqChangeNickname" class="tq-back-link">change</a>
      </span>
      <a class="tq-back-link" href="timeQuizHistory.html">History</a>
      <a class="tq-back-link" href="geoStreakGame.html">&larr; GeoStreak</a>
    </div>
  </header>

  <main class="tq-main">
    <!-- One-time nickname setup — shown until a name is actually saved,
         then replaced for good by the header's #tqHeaderNicknameWrap
         above (its "change" link brings this back on demand). Static
         markup, NOT rebuilt by renderStart(), so it (and whatever
         visibility state it's in) survives across every screen the same
         way GeoStreak's own #gsPlayerBar does. -->
    <div id="tqPlayerBar" style="display: none;">
      <span class="tq-player-label">Playing as</span>
      <div class="tq-input-row">
        <input
          type="text"
          id="tqNickname"
          class="form-control"
          maxlength="20"
          placeholder="Your name"
          autocomplete="off"
        />
        <button type="button" id="tqNicknameSave" class="btn btn-secondary">Save</button>
      </div>
    </div>

    <!-- Filled by renderStart() once timeQuiz.js's init() resolves the
         player's Firestore state — briefly shows a loading note rather
         than sitting blank, since that fetch (unlike the old
         localStorage read it replaced) isn't instant. -->
    <div id="tqStart">
      <div class="tq-panel"><p class="tq-panel-sub">Loading&hellip;</p></div>
    </div>
    <div id="tqQuestion" style="display: none;"></div>
    <div id="tqResult" style="display: none;"></div>
    <div id="tqFinal" style="display: none;"></div>
  </main>

  <script src="../fetch.js"></script>

  <!-- Firebase (compat build, same as geoStreakGame.html) — optional, see
       firebaseConfig.js and timeQuizLeaderboard.js. Must load before
       timeQuiz.js: renderStart() calls into the `TimeQuizBoard` global as
       soon as it runs. -->
  <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore-compat.js"></script>
  <script src="firebaseConfig.js"></script>
  <script src="timeQuizLeaderboard.js"></script>

  <script src="timeQuiz.js"></script>
</body>
</html>
