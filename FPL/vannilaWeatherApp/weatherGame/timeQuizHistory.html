<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link
    rel="stylesheet"
    href="https://stackpath.bootstrapcdn.com/bootswatch/4.4.1/minty/bootstrap.min.css"
  />
  <title>Time Quiz History — TENFORBEN Station</title>
  <link
    rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text x=%228%22 y=%2213%22 font-size=%2214%22 text-anchor=%22middle%22>%E2%8F%B1%EF%B8%8F</text></svg>"
  />
  <style>
    body {
      background: #060a14;
      color: #cfe8ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }

    .gs-header {
      background: linear-gradient(180deg, #0a1226 0%, #060a14 100%);
      border-bottom: 1px solid #1b2a4a;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .gs-brand {
      font-family: "Courier New", Courier, monospace;
      letter-spacing: 1px;
      font-size: 1rem;
      color: #7dd3fc;
    }
    .gs-back-link {
      font-family: "Courier New", Courier, monospace;
      color: #93a4c3;
      font-size: 0.85rem;
      text-decoration: none;
    }
    .gs-back-link:hover { color: #7dd3fc; text-decoration: underline; }
    .tqh-header-links {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .tqh-header-nickname-wrap {
      display: none;
    }
    .tqh-header-nickname {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.85rem;
      font-weight: bold;
      color: #f0b429;
    }
    /* Master viewers only — see renderHeaderNickname() in
       timeQuizHistoryPage.js. Green rather than the usual amber, so
       master status reads at a glance without opening devtools. */
    .tqh-header-nickname.tqh-header-nickname-master { color: #4ade80; }

    main.container {
      padding-top: 28px;
      padding-bottom: 60px;
      max-width: 760px;
    }

    h1 {
      font-family: "Courier New", Courier, monospace;
      font-size: 1.4rem;
      color: #e2ecff;
      text-align: center;
      margin-bottom: 6px;
    }
    .gs-status {
      text-align: center;
      color: #6b7fa8;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.85rem;
      margin-bottom: 4px;
    }
    .gs-copy-uid {
      text-align: center;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.75rem;
      margin-bottom: 28px;
    }
    .gs-copy-uid a { color: #6b7fa8; }
    .gs-copy-uid a:hover { color: #7dd3fc; }

    .gs-history-tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 28px;
    }
    .gs-tab-btn {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
      color: #93a4c3;
      background: transparent;
      border: 1px solid #1b2a4a;
      border-radius: 4px;
      padding: 6px 14px;
      cursor: pointer;
    }
    .gs-tab-btn:hover { color: #7dd3fc; border-color: #1f6feb; }
    .gs-tab-btn.gs-tab-active { color: #060a14; background: #7dd3fc; border-color: #7dd3fc; }

    h2.gs-section-title {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #6b7fa8;
      margin: 32px 0 14px;
    }

    /* ---- run cards (same shape as GeoStreak's own history.html) ---- */
    .gs-run-card {
      background: #0c1630;
      border: 1px solid #1b2a4a;
      border-radius: 8px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .gs-run-card-best {
      border-color: #f0b429;
      box-shadow: 0 0 0 1px #f0b429;
    }
    .gs-run-header-row {
      display: flex;
      align-items: stretch;
    }
    .gs-run-toggle {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 14px;
      background: transparent;
      border: none;
      color: inherit;
      text-align: left;
      padding: 14px 18px;
      cursor: pointer;
      font-family: inherit;
    }
    .gs-run-toggle:hover { background: #101c3c; }
    .gs-run-export-btn {
      flex: 0 0 auto;
      background: transparent;
      border: none;
      border-left: 1px solid #1b2a4a;
      color: #6b7fa8;
      font-size: 0.95rem;
      padding: 0 16px;
      cursor: pointer;
    }
    .gs-run-export-btn:hover { color: #7dd3fc; background: #101c3c; }
    .gs-run-streak {
      font-family: "Courier New", Courier, monospace;
      font-size: 1.4rem;
      font-weight: bold;
      color: #7dd3fc;
      min-width: 2.4em;
    }
    .gs-run-card-best .gs-run-streak { color: #f0b429; }
    .gs-run-meta {
      flex: 1 1 auto;
      font-size: 0.85rem;
      color: #9db4de;
    }
    .gs-run-caret {
      color: #6b7fa8;
      font-size: 0.8rem;
    }
    .gs-run-detail {
      border-top: 1px solid #1b2a4a;
      padding: 4px 18px 14px;
      overflow-x: auto;
    }

    .gs-round-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      margin-top: 10px;
    }
    .gs-round-table th {
      text-align: left;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.68rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #6b7fa8;
      padding: 6px 10px 6px 0;
      border-bottom: 1px solid #1b2a4a;
    }
    .gs-round-table td {
      padding: 7px 10px 7px 0;
      border-bottom: 1px solid #101a30;
      white-space: nowrap;
    }
    .gs-round-table tbody tr:last-child td { border-bottom: none; }

    .gs-badge {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.7rem;
      font-weight: bold;
      letter-spacing: 0.5px;
      padding: 2px 7px;
      border-radius: 3px;
      border: 1px solid currentColor;
    }
    .gs-badge-correct { color: #16a34a; }
    .gs-badge-incorrect { color: #dc2626; }

    /* How close a reading landed to the threshold it was judged against,
       independent of correct/incorrect — exactly at the threshold (gold)
       or within 2 degrees of it (green). Same colors as GeoStreak's own
       .gs-temp-gold/.gs-temp-green in history.html. See
       tempClosenessClass() in timeQuizHistoryPage.js. */
    .tq-temp-gold { color: #f0b429; font-weight: bold; }
    .tq-temp-green { color: #16a34a; font-weight: bold; }

    .gs-empty-note {
      text-align: center;
      color: #6b7fa8;
      font-size: 0.9rem;
      padding: 30px 0;
    }
    .gs-empty-note a { color: #7dd3fc; }

    /* ---- Insights (Most Used Cities/Countries), paginated — same shape
       as timeQuiz.html's own .tq-insight-col / .tq-city-list, duplicated
       here per this project's self-contained-per-page convention. ---- */
    .tq-insights-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      text-align: left;
    }
    .tq-insight-col { flex: 1 1 260px; min-width: 0; }
    .tq-insight-label {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.6rem;
      letter-spacing: 1.5px;
      color: #6b7fa8;
      margin: 0 0 6px;
    }
    .tq-city-list {
      list-style: none;
      padding: 0;
      margin: 0;
      text-align: left;
    }
    .tq-city-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      padding: 5px 4px;
      border-bottom: 1px solid #1b2a4a;
    }
    .tq-city-list li:last-child { border-bottom: none; }
    .tq-leaderboard-rank {
      font-family: "Courier New", Courier, monospace;
      color: #6b7fa8;
      width: 2.2em;
      text-align: right;
      flex-shrink: 0;
    }
    .tq-city-name { color: #cfe8ff; flex: 1 1 auto; }
    .tq-city-count {
      font-family: "Courier New", Courier, monospace;
      color: #7dd3fc;
      white-space: nowrap;
    }
    .tq-leaderboard-note {
      color: #6b7fa8;
      font-size: 0.85rem;
      font-style: italic;
    }
    .tq-lb-pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 10px;
    }
    .tq-page-btn {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
      color: #93a4c3;
      background: transparent;
      border: 1px solid #1b2a4a;
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
    }
    .tq-page-btn:hover:not(:disabled) { color: #7dd3fc; border-color: #1f6feb; }
    .tq-page-btn:disabled { color: #40506e; cursor: not-allowed; }
    .tq-page-label {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.75rem;
      color: #6b7fa8;
    }

    /* ---- Leaderboard (Overall/Today) — same shape as timeQuiz.html's
       own .tq-leaderboard-*, duplicated here per this page's
       self-contained convention. Reuses .gs-tab-btn/.gs-tab-active for
       the Overall/Today tabs (same classes the Mine/All Players tabs
       above already use) rather than a second tab styling. ---- */
    .tq-leaderboard-tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .tq-leaderboard-list {
      list-style: none;
      padding: 0;
      margin: 0;
      text-align: left;
    }
    .tq-leaderboard-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      padding: 5px 4px;
      border-bottom: 1px solid #1b2a4a;
    }
    .tq-leaderboard-list li:last-child { border-bottom: none; }
    .tq-leaderboard-list li.tq-leaderboard-me {
      background: #12244a;
      border-radius: 4px;
    }
    .tq-leaderboard-name {
      color: #cfe8ff;
      flex: 1 1 auto;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tq-leaderboard-streak {
      font-family: "Courier New", Courier, monospace;
      color: #7dd3fc;
      font-weight: bold;
    }
    .tq-leaderboard-runs,
    .tq-leaderboard-correct,
    .tq-leaderboard-avg {
      font-family: "Courier New", Courier, monospace;
      color: #6b7fa8;
      font-size: 0.75rem;
      width: 2.6em;
      text-align: right;
      flex-shrink: 0;
    }
    .tq-leaderboard-header-list { margin-bottom: 2px; }
    .tq-leaderboard-header-row {
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-size: 0.7rem !important;
      color: #6b7fa8;
      font-weight: bold;
    }
    .tq-leaderboard-header-row .tq-leaderboard-name { color: #6b7fa8; }

    /* Printing gets its own light, ink-friendly theme — same reasoning as
       GeoStreak's own history.html. */
    @media print {
      body { background: #fff; color: #14213d; }
      .gs-header, .gs-run-caret, .gs-run-export-btn { display: none; }
      .gs-copy-uid, .gs-history-tabs, .tq-insights-row, #tqhLeaderboardBody { display: none !important; }
      h1, .gs-status, h2.gs-section-title { color: #14213d; }
      .gs-run-card, .gs-run-card-best {
        background: #fff;
        border: 1px solid #ccc;
        box-shadow: none;
        break-inside: avoid;
      }
      .gs-run-toggle { cursor: default; }
      .gs-run-streak { color: #14213d; }
      .gs-run-card-best .gs-run-streak { color: #b45309; }
      .gs-run-meta { color: #555; }
      .gs-run-detail { display: block !important; border-top-color: #ddd; }
      .gs-round-table th { color: #666; border-bottom-color: #ccc; }
      .gs-round-table td { color: #14213d; border-bottom-color: #eee; }
      .gs-badge-correct { color: #15803d; }
      .gs-badge-incorrect { color: #b91c1c; }

      body.gs-printing-one .gs-run-card:not(.gs-print-target) { display: none; }
      body.gs-printing-one h2.gs-section-title { display: none; }
    }
  </style>
</head>
<body>
  <header class="gs-header">
    <div class="gs-brand">TENFORBEN // STATION — Time Quiz History</div>
    <div class="tqh-header-links">
      <!-- Only shown once a nickname has actually been saved (see
           renderHeaderNickname() in timeQuizHistoryPage.js) — a
           brand-new visitor still sees the back-link either way. -->
      <span class="tqh-header-nickname-wrap" id="tqhHeaderNicknameWrap">
        <span class="tqh-header-nickname" id="tqhHeaderNickname"></span>
      </span>
      <a class="gs-back-link" href="timeQuiz.html">&larr; Time Quiz</a>
    </div>
  </header>

  <main class="container">
    <h1>Time Quiz History</h1>
    <p class="gs-status" id="tqhStatus">Loading&hellip;</p>
    <p class="gs-copy-uid"><a href="#" id="tqhCopyUid" style="display: none;">Copy my player ID</a></p>

    <!-- Master accounts only (same MASTER_UIDS/isMaster() allowlist as
         GeoStreak's own history.html) — hidden for everyone else. -->
    <div class="gs-history-tabs" id="tqhTabs" style="display: none;">
      <button type="button" id="tqhTabMine" class="gs-tab-btn gs-tab-active">My Attempts</button>
      <button type="button" id="tqhTabAll" class="gs-tab-btn">All Players</button>
    </div>

    <h2 class="gs-section-title">Insights — Most Used Worldwide</h2>
    <!-- Filled by loadInsights() — Top Countries for every viewer, Top
         Cities column only added for a master uid. Built dynamically
         rather than two hardcoded columns, so a non-master viewer's DOM
         never contains the Top Cities markup at all. -->
    <div class="tq-insights-row" id="tqhInsights"><p class="tq-leaderboard-note">Loading&hellip;</p></div>

    <h2 class="gs-section-title">Leaderboard</h2>
    <div id="tqhLeaderboardBody">
      <div class="tq-leaderboard-tabs">
        <button type="button" id="tqhLbTabOverall" class="gs-tab-btn gs-tab-active">Overall</button>
        <button type="button" id="tqhLbTabToday" class="gs-tab-btn">Today</button>
      </div>
      <ul class="tq-leaderboard-list tq-leaderboard-header-list">
        <li class="tq-leaderboard-header-row">
          <span class="tq-leaderboard-rank">#</span>
          <span class="tq-leaderboard-name">Name</span>
          <span class="tq-leaderboard-streak" title="Best score">Score</span>
          <span class="tq-leaderboard-runs" title="Total quizzes">Runs</span>
          <span class="tq-leaderboard-correct" title="Total correct">Cor</span>
          <span class="tq-leaderboard-avg" title="Correct ÷ quizzes">Avg</span>
        </li>
      </ul>
      <div id="tqhLeaderboardList"></div>
      <div id="tqhLeaderboardPagination" class="tq-lb-pagination"></div>
    </div>

    <div id="tqhBestSection">
      <h2 class="gs-section-title">🏆 Your Best 10</h2>
      <div id="tqhBest"></div>
    </div>

    <h2 class="gs-section-title" id="tqhListTitle">All Attempts</h2>
    <div id="tqhList"></div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore-compat.js"></script>
  <script src="firebaseConfig.js"></script>
  <script src="timeQuizHistoryPage.js"></script>
</body>
</html>
