<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link
    rel="stylesheet"
    href="https://stackpath.bootstrapcdn.com/bootswatch/4.4.1/minty/bootstrap.min.css"
  />
  <title>GeoStreak — TENFORBEN Station</title>
  <link
    rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text x=%228%22 y=%2213%22 font-size=%2214%22 text-anchor=%22middle%22>%F0%9F%A6%96</text></svg>"
  />
  <style>
    body {
      background: #060a14;
      color: #cfe8ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }

    .gs-header {
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, #0a1226 0%, #060a14 100%);
      border-bottom: 1px solid #1b2a4a;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .gs-radar {
      position: absolute;
      top: 50%;
      left: 24px;
      width: 26px;
      height: 26px;
      margin-top: -13px;
      border-radius: 50%;
      border: 1px solid #1f6feb;
      opacity: 0.6;
    }
    .gs-radar::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(from 0deg, rgba(56, 189, 248, 0.9), transparent 35%);
      animation: gs-radar-sweep 2.2s linear infinite;
    }
    @keyframes gs-radar-sweep {
      to { transform: rotate(360deg); }
    }
    .gs-brand {
      font-family: "Courier New", Courier, monospace;
      letter-spacing: 1px;
      font-size: 1rem;
      padding-left: 46px;
      color: #7dd3fc;
    }
    .gs-header-links {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .gs-back-link {
      font-family: "Courier New", Courier, monospace;
      color: #93a4c3;
      font-size: 0.85rem;
      text-decoration: none;
    }
    .gs-back-link:hover {
      color: #7dd3fc;
      text-decoration: underline;
    }
    .gs-header-nickname-wrap {
      display: flex;
      align-items: center;
      gap: 7px;
      padding-right: 4px;
      border-right: 1px solid #1b2a4a;
      margin-right: 2px;
    }
    .gs-header-nickname {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.85rem;
      font-weight: bold;
      color: #f0b429;
    }

    .gs-footer {
      text-align: center;
      margin-top: 40px;
    }
    .gs-footer a {
      font-family: "Courier New", Courier, monospace;
      color: #6b7fa8;
      font-size: 0.8rem;
      text-decoration: none;
    }
    .gs-footer a:hover {
      color: #7dd3fc;
      text-decoration: underline;
    }

    main.container {
      padding-top: 28px;
      padding-bottom: 60px;
      max-width: 640px;
    }

    .gs-stats {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-bottom: 28px;
    }
    .gs-stat-box {
      background: #0c1630;
      border: 1px solid #1b2a4a;
      border-radius: 6px;
      padding: 12px 26px;
      text-align: center;
      min-width: 140px;
    }
    .gs-stat-label {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.7rem;
      letter-spacing: 2px;
      color: #6b7fa8;
    }
    .gs-stat-value {
      font-family: "Courier New", Courier, monospace;
      font-size: 2rem;
      color: #7dd3fc;
      font-weight: bold;
    }
    @keyframes gs-pulse {
      0% { transform: scale(1); color: #7dd3fc; }
      40% { transform: scale(1.35); color: #4ade80; }
      100% { transform: scale(1); color: #7dd3fc; }
    }
    .geo-pulse {
      animation: gs-pulse 0.6s ease;
    }

    .gs-country-tally {
      text-align: center;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.85rem;
      color: #9db4de;
      min-height: 1.4em;
      margin-bottom: 22px;
    }

    .gs-tally-chip {
      position: relative;
      cursor: default;
      border-bottom: 1px dotted #4a5f8f;
      outline: none;
    }
    .gs-tally-popover {
      display: none;
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: #0f1830;
      border: 1px solid #2c3d63;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.8rem;
      line-height: 1.5;
      color: #cfe0ff;
      white-space: nowrap;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      z-index: 10;
    }
    .gs-tally-chip:hover .gs-tally-popover,
    .gs-tally-chip:focus .gs-tally-popover {
      display: block;
    }

    .gs-condition {
      text-align: center;
      font-size: 1.15rem;
      color: #e2ecff;
      margin-bottom: 18px;
    }

    .gs-input-row {
      display: flex;
      gap: 8px;
      max-width: 420px;
      margin: 0 auto 14px;
    }

    .gs-timer-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 6px;
    }
    .gs-timer {
      font-family: "Courier New", Courier, monospace;
      font-size: 1.3rem;
      font-weight: bold;
      color: #7dd3fc;
      transition: color 0.2s ease;
    }
    .gs-timer.gs-timer-warn { color: #f0b429; }
    .gs-timer.gs-timer-danger { color: #f87171; }

    /* Deliberately understated next to the Guess button — pausing is a
       side action, and it can't rescue a round that's already running out. */
    .gs-pause-btn {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.75rem;
      letter-spacing: 1px;
      color: #93a4c3;
      background: transparent;
      border: 1px solid #1b2a4a;
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
    }
    .gs-pause-btn:hover { color: #7dd3fc; border-color: #1f6feb; }
    /* Pause requested, waiting for the current attempt to finish. */
    .gs-pause-btn.gs-pause-armed {
      color: #f0b429;
      border-color: #f0b429;
    }

    .gs-hint {
      text-align: center;
      color: #f0b429;
      min-height: 1.3em;
      font-size: 0.9rem;
    }

    /* Result card: reuses Weather.JS's own light card markup, so it needs
       its own positioned wrapper for the stamp/label overlays only. */
    .geo-result-wrap {
      position: relative;
      display: flex;
      justify-content: center;
      margin-top: 10px;
    }
    /* The reused card carries Bootstrap's mt-5 from the main app, where it
       sits below a nav bar. Here it just throws off the stamp/label overlay
       positioning below, so it's neutralized for this reuse only. Bootstrap's
       spacing utilities are !important, so this override has to match. */
    /* The card has no color of its own, so its text inherits the page's
       light-blue body colour and goes hard to read on the card's white
       background. Bootstrap's default body colour restores normal contrast
       for this reuse only — the main app's page is unaffected. */
    .geo-result-wrap .card {
      margin-top: 0 !important;
      color: #212529;
    }
    .geo-stamp {
      position: absolute;
      top: 4px;
      right: calc(50% - 10rem + 12px);
      z-index: 5;
      font-family: "Courier New", Courier, monospace;
      font-weight: bold;
      font-size: 0.85rem;
      letter-spacing: 1px;
      padding: 4px 10px;
      border: 2px solid currentColor;
      border-radius: 4px;
      transform: rotate(8deg);
    }
    .geo-stamp-correct { color: #16a34a; }
    .geo-stamp-incorrect { color: #dc2626; }

    /* First-time-ever city (checked against the lifetime city log, not just
       this session) briefly brightens the result card so the discovery
       doesn't pass unnoticed under the CORRECT/INCORRECT stamp. */
    @keyframes gs-brighten {
      0% { filter: brightness(1); box-shadow: none; }
      25% { filter: brightness(1.6); box-shadow: 0 0 22px 6px rgba(125, 211, 252, 0.75); }
      100% { filter: brightness(1); box-shadow: none; }
    }
    .geo-result-wrap.geo-new-city {
      animation: gs-brighten 2s ease;
    }

    /* Correct-guess result cards fade out a few seconds into the next
       round rather than lingering on screen. Duration here must match
       RESULT_FADE_MS in app.js. */
    #gsResult {
      transition: opacity 0.5s ease;
    }
    #gsResult.geo-result-fade-out {
      opacity: 0;
    }

    /* One panel look shared by the start, pause and game-over screens —
       they show the same insight numbers and differ only in heading and
       the single button at the bottom. */
    .gs-panel {
      background: #0c1630;
      border: 1px solid #1b2a4a;
      border-radius: 8px;
      padding: 24px;
      max-width: 420px;
      margin: 0 auto;
      text-align: center;
    }
    .gs-panel h3 {
      color: #7dd3fc;
      font-family: "Courier New", Courier, monospace;
      letter-spacing: 1px;
    }
    .gs-panel-danger h3 { color: #f87171; }
    .gs-panel-sub {
      color: #9db4de;
      font-size: 0.9rem;
    }

    .gs-insights {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin: 18px 0;
    }
    .gs-insight {
      flex: 1 1 100px;
      background: #060a14;
      border: 1px solid #1b2a4a;
      border-radius: 6px;
      padding: 10px 6px;
    }
    .gs-insight-label {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.6rem;
      letter-spacing: 1.5px;
      color: #6b7fa8;
    }
    .gs-insight-value {
      font-family: "Courier New", Courier, monospace;
      font-size: 1.4rem;
      font-weight: bold;
      color: #7dd3fc;
    }
    .gs-insights-note {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.65rem;
      color: #6b7fa8;
      margin-top: -8px;
      margin-bottom: 16px;
    }

    /* Top-5-cities insight — only rendered once the player has enough
       runs behind them (see buildCityInsightsHtml's gamesPlayed check in
       ui.js) for a most-used ranking to mean anything. */
    .gs-city-insights {
      margin: -6px 0 16px;
    }
    .gs-city-list {
      list-style: none;
      padding: 0;
      margin: 0;
      text-align: left;
    }
    .gs-city-list li {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.8rem;
      padding: 3px 4px;
      border-bottom: 1px solid #1b2a4a;
    }
    .gs-city-list li:last-child { border-bottom: none; }
    .gs-city-name { color: #cfe8ff; }
    .gs-city-count {
      font-family: "Courier New", Courier, monospace;
      color: #7dd3fc;
      white-space: nowrap;
    }

    /* Shown once, the first time a nickname hasn't been saved yet — its
       .gs-input-row is the exact same width/layout as the search box
       below it, so the two rows line up instead of one being pushed over
       by an inline label. */
    #gsPlayerBar {
      max-width: 420px;
      margin: 0 auto;
    }
    .gs-player-label {
      display: block;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.7rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #6b7fa8;
      margin-bottom: 6px;
    }
    .gs-leaderboard-note {
      color: #6b7fa8;
      font-size: 0.85rem;
      font-style: italic;
    }
    .gs-leaderboard-list {
      list-style: none;
      padding: 0;
      margin: 0;
      text-align: left;
    }
    .gs-leaderboard-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      padding: 5px 4px;
      border-bottom: 1px solid #1b2a4a;
    }
    .gs-leaderboard-list li:last-child { border-bottom: none; }
    /* Your own row, wherever it falls in the ranking. */
    .gs-leaderboard-list li.gs-leaderboard-me {
      background: #12244a;
      border-radius: 4px;
    }
    .gs-leaderboard-rank {
      font-family: "Courier New", Courier, monospace;
      color: #6b7fa8;
      width: 2.2em;
      text-align: right;
      flex-shrink: 0;
    }
    .gs-leaderboard-name {
      color: #cfe8ff;
      flex: 1 1 auto;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .gs-leaderboard-streak {
      font-family: "Courier New", Courier, monospace;
      color: #7dd3fc;
      font-weight: bold;
    }
    .gs-leaderboard-runs,
    .gs-leaderboard-correct,
    .gs-leaderboard-avg {
      font-family: "Courier New", Courier, monospace;
      color: #6b7fa8;
      font-size: 0.75rem;
      width: 2.6em;
      text-align: right;
      flex-shrink: 0;
    }
    /* Column labels above the list — same row shape (reuses
       .gs-leaderboard-list li's flex layout) as the data rows below it,
       just bold/muted/uppercase instead of a real ranking. */
    .gs-leaderboard-header-list { margin-bottom: 2px; }
    .gs-leaderboard-header-row {
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-size: 0.7rem !important;
      color: #6b7fa8;
      font-weight: bold;
    }
    .gs-leaderboard-header-row .gs-leaderboard-name { color: #6b7fa8; }

    .gs-pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 12px;
    }
    .gs-page-btn {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
      color: #93a4c3;
      background: transparent;
      border: 1px solid #1b2a4a;
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
    }
    .gs-page-btn:hover:not(:disabled) { color: #7dd3fc; border-color: #1f6feb; }
    .gs-page-btn:disabled { color: #40506e; cursor: not-allowed; }
    .gs-page-label {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.75rem;
      color: #6b7fa8;
    }

    .gs-leaderboard-tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .gs-tab-btn {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
      color: #93a4c3;
      background: transparent;
      border: 1px solid #1b2a4a;
      border-radius: 4px;
      padding: 5px 14px;
      cursor: pointer;
    }
    .gs-tab-btn:hover { color: #7dd3fc; border-color: #1f6feb; }
    .gs-tab-btn.gs-tab-active {
      color: #7dd3fc;
      border-color: #7dd3fc;
      background: #12244a;
    }

    .gs-howto {
      text-align: left;
      font-size: 0.85rem;
      color: #93a4c3;
      padding-left: 20px;
      margin-bottom: 20px;
    }
    .gs-howto li { margin-bottom: 4px; }

    /* Flag hover-zoom, matching the main Weather.JS page. */
    .weather-flag {
      transition: transform 0.15s ease;
      position: relative;
    }
    .weather-flag:hover {
      transform: scale(3);
      z-index: 10;
    }
  </style>
</head>
<body>
  <header class="gs-header">
    <div class="gs-radar"></div>
    <div class="gs-brand">TENFORBEN // STATION — GeoStreak</div>
    <div class="gs-header-links">
      <!-- Shown once a nickname has been saved (see leaderboard.js); until
           then #gsPlayerBar above the search box handles the first save. -->
      <span id="gsHeaderNicknameWrap" class="gs-header-nickname-wrap" style="display: none;">
        <span id="gsHeaderNickname" class="gs-header-nickname"></span>
        <a href="#" id="gsChangeNickname" class="gs-back-link">change</a>
      </span>
      <a class="gs-back-link" href="history.html">History</a>
      <a class="gs-back-link" href="checklist/morningChecklist.html">Morning Checklist</a>
      <a class="gs-back-link" href="../southernHemisphere/southernHemisphere.html">Southern Hemisphere</a>
      <a class="gs-back-link" href="../../stadiumMap/stadiumMap.html">Stadiums Visited</a>
      <a class="gs-back-link" href="../index.html">&larr; Weather.JS</a>
    </div>
  </header>

  <main class="container" id="geoStreakRoot">
    <div class="gs-stats">
      <div class="gs-stat-box">
        <div class="gs-stat-label">STREAK</div>
        <div class="gs-stat-value" id="gsStreak">0</div>
      </div>
      <div class="gs-stat-box">
        <div class="gs-stat-label">HIGH SCORE</div>
        <div class="gs-stat-value" id="gsHighScore">0</div>
      </div>
    </div>

    <div class="gs-country-tally" id="gsCountryTally"></div>

    <!-- One-time nickname setup — shown until a name is actually saved,
         then replaced by the header's #gsHeaderNicknameWrap for good (its
         "change" link brings this back on demand; see leaderboard.js). -->
    <div id="gsPlayerBar" style="display: none;">
      <span class="gs-player-label">Playing as</span>
      <div class="gs-input-row">
        <input
          type="text"
          id="gsNickname"
          class="form-control"
          maxlength="20"
          placeholder="Your name"
          autocomplete="off"
        />
        <button type="button" id="gsNicknameSave" class="btn btn-secondary">Save</button>
      </div>
    </div>

    <!-- Always visible, in every state, including before Start Game is ever
         pressed: while a round is live this is a guess; otherwise it's a
         plain city weather lookup, same as the main Weather.JS search. -->
    <div id="gsSearchRow">
      <div class="gs-input-row">
        <input
          type="text"
          id="gsCityInput"
          class="form-control"
          placeholder="Type a city name…"
          autocomplete="off"
        />
        <button type="button" id="gsSubmit" class="btn btn-primary">Search</button>
      </div>
      <p class="gs-hint" id="gsHint"></p>
    </div>

    <!-- Start / pause / game-over panels are all rendered by ui.js; the play
         area is the only screen written out as static markup. Exactly one of
         the four is visible at a time. -->
    <div id="gsStart"></div>

    <div id="gsPlayArea" style="display: none;">
      <p class="gs-condition" id="gsCondition"></p>
      <!-- Hidden on Game Over so the round's last question (above) stays
           visible next to the result card, without a dead timer under it. -->
      <div id="gsPlayControls">
        <div class="gs-timer-row">
          <div class="gs-timer" id="gsTimer">20s</div>
          <button type="button" id="gsPause" class="gs-pause-btn">&#9208; PAUSE</button>
          <!-- Outside of a live round the leaderboard already shows itself
               automatically (see gsInsights/gsLeaderboard toggling in
               app.js) — this button is only needed to peek at it mid-round,
               without pausing or otherwise interrupting the round. -->
          <button type="button" id="gsLeaderboardPeek" class="gs-pause-btn">&#127942; Show Leaderboard</button>
        </div>
      </div>
    </div>

    <div id="gsPaused" style="display: none;"></div>

    <div id="gsGameOver" style="display: none;"></div>

    <div id="gsResult"></div>

    <!-- Lifetime numbers (streak/correct/attempts/accuracy + top cities),
         shared across the start/pause/game-over states and deliberately
         placed below the result card so a fresh guess/search isn't buried
         under a wall of stats. -->
    <div id="gsInsights" style="display: none;"></div>

    <!-- Online leaderboard (Firebase Firestore, optional — see
         leaderboard.js and the README's Leaderboard section). Shown/hidden
         alongside gsInsights above. -->
    <div id="gsLeaderboard" style="display: none;">
      <div class="gs-panel">
        <h3>Leaderboard</h3>
        <div class="gs-leaderboard-tabs">
          <button type="button" id="gsLbTabOverall" class="gs-tab-btn gs-tab-active">Overall</button>
          <button type="button" id="gsLbTabToday" class="gs-tab-btn">Today</button>
        </div>
        <ul class="gs-leaderboard-list gs-leaderboard-header-list">
          <li class="gs-leaderboard-header-row">
            <span class="gs-leaderboard-rank">#</span>
            <span class="gs-leaderboard-name">Name</span>
            <span class="gs-leaderboard-streak" title="Highest streak">Str</span>
            <span class="gs-leaderboard-runs" title="Total runs">Runs</span>
            <span class="gs-leaderboard-correct" title="Total correct">Cor</span>
            <span class="gs-leaderboard-avg" title="Correct ÷ runs">Avg</span>
          </li>
        </ul>
        <div id="gsLeaderboardList"></div>
        <div id="gsLeaderboardPagination" class="gs-pagination"></div>
      </div>
    </div>

    <footer class="gs-footer">
      <a
        href="https://github.com/TenForBen/TenForBen.github.io/blob/feature/geoStreakGame/FPL/vannilaWeatherApp/weatherGame/README.md"
        target="_blank"
        rel="noopener"
        >About GeoStreak / README</a
      >
    </footer>
  </main>

  <script src="../fetch.js"></script>
  <script src="../ui.js"></script>

  <!-- Firebase (compat build — matches this codebase's plain-<script>,
       no-bundler style rather than the modular/ESM SDK). Optional: see
       firebaseConfig.js and leaderboard.js. Must load before app.js: app.js
       calls initGeoStreak() -> showStartScreen() synchronously as soon as
       it runs, and that call needs the `Leaderboard` global to already
       exist (uses escapeHtml from ui.js above, so it comes after that). -->
  <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore-compat.js"></script>
  <script src="firebaseConfig.js"></script>
  <script src="leaderboard.js"></script>

  <script src="../app.js"></script>
</body>
</html>
