<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link
    rel="stylesheet"
    href="https://stackpath.bootstrapcdn.com/bootswatch/4.4.1/minty/bootstrap.min.css"
  />
  <title>GeoStreak — TENFORBEN Station</title>
  <link
    rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text x=%228%22 y=%2213%22 font-size=%2214%22 text-anchor=%22middle%22>%F0%9F%A6%96</text></svg>"
  />
  <style>
    body {
      background: #060a14;
      color: #cfe8ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }

    .gs-header {
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, #0a1226 0%, #060a14 100%);
      border-bottom: 1px solid #1b2a4a;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .gs-radar {
      position: absolute;
      top: 50%;
      left: 24px;
      width: 26px;
      height: 26px;
      margin-top: -13px;
      border-radius: 50%;
      border: 1px solid #1f6feb;
      opacity: 0.6;
    }
    .gs-radar::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(from 0deg, rgba(56, 189, 248, 0.9), transparent 35%);
      animation: gs-radar-sweep 2.2s linear infinite;
    }
    @keyframes gs-radar-sweep {
      to { transform: rotate(360deg); }
    }
    .gs-brand {
      font-family: "Courier New", Courier, monospace;
      letter-spacing: 1px;
      font-size: 1rem;
      padding-left: 46px;
      color: #7dd3fc;
    }
    .gs-header-links {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .gs-back-link {
      font-family: "Courier New", Courier, monospace;
      color: #93a4c3;
      font-size: 0.85rem;
      text-decoration: none;
    }
    .gs-back-link:hover {
      color: #7dd3fc;
      text-decoration: underline;
    }

    .gs-footer {
      text-align: center;
      margin-top: 40px;
    }
    .gs-footer a {
      font-family: "Courier New", Courier, monospace;
      color: #6b7fa8;
      font-size: 0.8rem;
      text-decoration: none;
    }
    .gs-footer a:hover {
      color: #7dd3fc;
      text-decoration: underline;
    }

    main.container {
      padding-top: 28px;
      padding-bottom: 60px;
      max-width: 640px;
    }

    .gs-stats {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-bottom: 28px;
    }
    .gs-stat-box {
      background: #0c1630;
      border: 1px solid #1b2a4a;
      border-radius: 6px;
      padding: 12px 26px;
      text-align: center;
      min-width: 140px;
    }
    .gs-stat-label {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.7rem;
      letter-spacing: 2px;
      color: #6b7fa8;
    }
    .gs-stat-value {
      font-family: "Courier New", Courier, monospace;
      font-size: 2rem;
      color: #7dd3fc;
      font-weight: bold;
    }
    @keyframes gs-pulse {
      0% { transform: scale(1); color: #7dd3fc; }
      40% { transform: scale(1.35); color: #4ade80; }
      100% { transform: scale(1); color: #7dd3fc; }
    }
    .geo-pulse {
      animation: gs-pulse 0.6s ease;
    }

    .gs-country-tally {
      text-align: center;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.85rem;
      color: #9db4de;
      min-height: 1.4em;
      margin-bottom: 22px;
    }

    .gs-condition {
      text-align: center;
      font-size: 1.15rem;
      color: #e2ecff;
      margin-bottom: 18px;
    }

    .gs-input-row {
      display: flex;
      gap: 8px;
      max-width: 420px;
      margin: 0 auto 14px;
    }

    .gs-timer-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 6px;
    }
    .gs-timer {
      font-family: "Courier New", Courier, monospace;
      font-size: 1.3rem;
      font-weight: bold;
      color: #7dd3fc;
      transition: color 0.2s ease;
    }
    .gs-timer.gs-timer-warn { color: #f0b429; }
    .gs-timer.gs-timer-danger { color: #f87171; }

    /* Deliberately understated next to the Guess button — pausing is a
       side action, and it can't rescue a round that's already running out. */
    .gs-pause-btn {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.75rem;
      letter-spacing: 1px;
      color: #93a4c3;
      background: transparent;
      border: 1px solid #1b2a4a;
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
    }
    .gs-pause-btn:hover { color: #7dd3fc; border-color: #1f6feb; }
    /* Pause requested, waiting for the current attempt to finish. */
    .gs-pause-btn.gs-pause-armed {
      color: #f0b429;
      border-color: #f0b429;
    }

    .gs-hint {
      text-align: center;
      color: #f0b429;
      min-height: 1.3em;
      font-size: 0.9rem;
    }

    /* Result card: reuses Weather.JS's own light card markup, so it needs
       its own positioned wrapper for the stamp/label overlays only. */
    .geo-result-wrap {
      position: relative;
      display: flex;
      justify-content: center;
      margin-top: 10px;
    }
    /* The reused card carries Bootstrap's mt-5 from the main app, where it
       sits below a nav bar. Here it just throws off the stamp/label overlay
       positioning below, so it's neutralized for this reuse only. Bootstrap's
       spacing utilities are !important, so this override has to match. */
    /* The card has no color of its own, so its text inherits the page's
       light-blue body colour and goes hard to read on the card's white
       background. Bootstrap's default body colour restores normal contrast
       for this reuse only — the main app's page is unaffected. */
    .geo-result-wrap .card {
      margin-top: 0 !important;
      color: #212529;
    }
    .geo-stamp {
      position: absolute;
      top: 4px;
      right: calc(50% - 10rem + 12px);
      z-index: 5;
      font-family: "Courier New", Courier, monospace;
      font-weight: bold;
      font-size: 0.85rem;
      letter-spacing: 1px;
      padding: 4px 10px;
      border: 2px solid currentColor;
      border-radius: 4px;
      transform: rotate(8deg);
    }
    .geo-stamp-correct { color: #16a34a; }
    .geo-stamp-incorrect { color: #dc2626; }

    /* First-time-ever city (checked against the lifetime city log, not just
       this session) briefly brightens the result card so the discovery
       doesn't pass unnoticed under the CORRECT/INCORRECT stamp. */
    @keyframes gs-brighten {
      0% { filter: brightness(1); box-shadow: none; }
      25% { filter: brightness(1.6); box-shadow: 0 0 22px 6px rgba(125, 211, 252, 0.75); }
      100% { filter: brightness(1); box-shadow: none; }
    }
    .geo-result-wrap.geo-new-city {
      animation: gs-brighten 2s ease;
    }

    /* Correct-guess result cards fade out a few seconds into the next
       round rather than lingering on screen. Duration here must match
       RESULT_FADE_MS in app.js. */
    #gsResult {
      transition: opacity 0.5s ease;
    }
    #gsResult.geo-result-fade-out {
      opacity: 0;
    }

    /* One panel look shared by the start, pause and game-over screens —
       they show the same insight numbers and differ only in heading and
       the single button at the bottom. */
    .gs-panel {
      background: #0c1630;
      border: 1px solid #1b2a4a;
      border-radius: 8px;
      padding: 24px;
      max-width: 420px;
      margin: 0 auto;
      text-align: center;
    }
    .gs-panel h3 {
      color: #7dd3fc;
      font-family: "Courier New", Courier, monospace;
      letter-spacing: 1px;
    }
    .gs-panel-danger h3 { color: #f87171; }
    .gs-panel-sub {
      color: #9db4de;
      font-size: 0.9rem;
    }

    .gs-insights {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin: 18px 0;
    }
    .gs-insight {
      flex: 1 1 100px;
      background: #060a14;
      border: 1px solid #1b2a4a;
      border-radius: 6px;
      padding: 10px 6px;
    }
    .gs-insight-label {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.6rem;
      letter-spacing: 1.5px;
      color: #6b7fa8;
    }
    .gs-insight-value {
      font-family: "Courier New", Courier, monospace;
      font-size: 1.4rem;
      font-weight: bold;
      color: #7dd3fc;
    }
    .gs-insights-note {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.65rem;
      color: #6b7fa8;
      margin-top: -8px;
      margin-bottom: 16px;
    }

    /* Top-5-cities insight — only rendered once the player has enough
       runs behind them (see buildCityInsightsHtml's gamesPlayed check in
       ui.js) for a most-used ranking to mean anything. */
    .gs-city-insights {
      margin: -6px 0 16px;
    }
    .gs-city-list {
      list-style: none;
      padding: 0;
      margin: 0;
      text-align: left;
    }
    .gs-city-list li {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.8rem;
      padding: 3px 4px;
      border-bottom: 1px solid #1b2a4a;
    }
    .gs-city-list li:last-child { border-bottom: none; }
    .gs-city-name { color: #cfe8ff; }
    .gs-city-count {
      font-family: "Courier New", Courier, monospace;
      color: #7dd3fc;
      white-space: nowrap;
    }

    .gs-howto {
      text-align: left;
      font-size: 0.85rem;
      color: #93a4c3;
      padding-left: 20px;
      margin-bottom: 20px;
    }
    .gs-howto li { margin-bottom: 4px; }

    /* Flag hover-zoom, matching the main Weather.JS page. */
    .weather-flag {
      transition: transform 0.15s ease;
      position: relative;
    }
    .weather-flag:hover {
      transform: scale(3);
      z-index: 10;
    }
  </style>
</head>
<body>
  <header class="gs-header">
    <div class="gs-radar"></div>
    <div class="gs-brand">TENFORBEN // STATION — GeoStreak</div>
    <div class="gs-header-links">
      <a class="gs-back-link" href="../southernHemisphere/southernHemisphere.html">Southern Hemisphere</a>
      <a class="gs-back-link" href="../../stadiumMap/stadiumMap.html">Stadiums Visited</a>
      <a class="gs-back-link" href="../index.html">&larr; Weather.JS</a>
    </div>
  </header>

  <main class="container" id="geoStreakRoot">
    <div class="gs-stats">
      <div class="gs-stat-box">
        <div class="gs-stat-label">STREAK</div>
        <div class="gs-stat-value" id="gsStreak">0</div>
      </div>
      <div class="gs-stat-box">
        <div class="gs-stat-label">HIGH SCORE</div>
        <div class="gs-stat-value" id="gsHighScore">0</div>
      </div>
    </div>

    <div class="gs-country-tally" id="gsCountryTally"></div>

    <!-- Start / pause / game-over panels are all rendered by ui.js; the play
         area is the only screen written out as static markup. Exactly one of
         the four is visible at a time. -->
    <div id="gsStart"></div>

    <div id="gsPlayArea" style="display: none;">
      <p class="gs-condition" id="gsCondition"></p>
      <!-- Everything below is hidden on Game Over so the round's last
           question (above) stays visible next to the result card. -->
      <div id="gsPlayControls">
        <div class="gs-input-row">
          <input
            type="text"
            id="gsCityInput"
            class="form-control"
            placeholder="Type a city name…"
            autocomplete="off"
          />
          <button type="button" id="gsSubmit" class="btn btn-primary">Guess</button>
        </div>
        <div class="gs-timer-row">
          <div class="gs-timer" id="gsTimer">20s</div>
          <button type="button" id="gsPause" class="gs-pause-btn">&#9208; PAUSE</button>
        </div>
        <p class="gs-hint" id="gsHint"></p>
      </div>
    </div>

    <div id="gsPaused" style="display: none;"></div>

    <div id="gsGameOver" style="display: none;"></div>

    <div id="gsResult"></div>

    <footer class="gs-footer">
      <a
        href="https://github.com/TenForBen/TenForBen.github.io/blob/feature/geoStreakGame/FPL/vannilaWeatherApp/weatherGame/README.md"
        target="_blank"
        rel="noopener"
        >About GeoStreak / README</a
      >
    </footer>
  </main>

  <script src="../fetch.js"></script>
  <script src="../ui.js"></script>
  <script src="../app.js"></script>
</body>
</html>
