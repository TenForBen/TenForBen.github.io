<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link
    rel="stylesheet"
    href="https://stackpath.bootstrapcdn.com/bootswatch/4.4.1/minty/bootstrap.min.css"
  />
  <title>DistanceLearningQuiz Leaderboard — TENFORBEN Station</title>
  <link
    rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text x=%228%22 y=%2213%22 font-size=%2214%22 text-anchor=%22middle%22>%F0%9F%8F%86</text></svg>"
  />
  <style>
    /* Same look as distanceLearningQuiz.html; the leaderboard panel itself
       is rendered by distanceLearningBoard.js. */
    body {
      background: #060a14;
      color: #cfe8ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }
    .dl-header {
      background: linear-gradient(180deg, #0a1226 0%, #060a14 100%);
      border-bottom: 1px solid #1b2a4a;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .dl-brand { font-family: "Courier New", Courier, monospace; letter-spacing: 1px; color: #fb923c; }
    .dl-header-links { display: flex; flex-wrap: wrap; gap: 16px; }
    .dl-back-link { font-family: "Courier New", Courier, monospace; color: #93a4c3; font-size: 0.85rem; text-decoration: none; }
    .dl-back-link:hover { color: #fb923c; text-decoration: underline; }
    main.dl-main { max-width: 640px; margin: 0 auto; padding: 28px 16px 60px; }
    h1 { font-family: "Courier New", Courier, monospace; color: #fb923c; font-size: 1.6rem; margin-bottom: 6px; }
    .dl-sub { color: #9db4de; margin-bottom: 18px; }

    .dl-panel {
      background: #0c1630;
      border: 1px solid #1b2a4a;
      border-radius: 10px;
      padding: 22px 20px;
      text-align: center;
    }
    .dl-panel h3 { font-family: "Courier New", Courier, monospace; color: #fb923c; margin-bottom: 10px; }
    .dl-lb-tabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 12px; }
    .dl-lb-tab {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.75rem;
      color: #93a4c3;
      background: transparent;
      border: 1px solid #1b2a4a;
      border-radius: 4px;
      padding: 5px 12px;
      cursor: pointer;
    }
    .dl-lb-tab:hover { color: #fb923c; border-color: #f97316; }
    .dl-lb-tab-active { color: #fb923c; border-color: #fb923c; background: #2a1708; }
    .dl-lb-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; text-align: left; }
    .dl-lb-table th {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.65rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #6b7fa8;
      padding: 6px 8px;
      border-bottom: 1px solid #1b2a4a;
    }
    .dl-lb-table td { padding: 8px; border-bottom: 1px solid #101a30; color: #cfe8ff; }
    .dl-lb-rank { color: #6b7fa8; width: 2.4em; }
    .dl-lb-score { font-family: "Courier New", Courier, monospace; font-weight: bold; color: #fb923c; }
    .dl-lb-runs { color: #6b7fa8; }
    .dl-lb-top td { background: rgba(240, 180, 41, 0.18); }
    .dl-lb-top .dl-lb-score { color: #f0b429; }
    .dl-lb-me td { box-shadow: inset 0 -2px 0 #7dd3fc; }
    .dl-lb-me .dl-lb-name { color: #7dd3fc; font-weight: bold; }
    .dl-lb-note { color: #6b7fa8; font-size: 0.85rem; font-style: italic; margin: 0; }
  </style>
</head>
<body>
  <header class="dl-header">
    <div class="dl-brand">TENFORBEN // STATION — DistanceLearningQuiz</div>
    <div class="dl-header-links">
      <a class="dl-back-link" href="distanceLearningInsights.html">Insights</a>
      <a class="dl-back-link" href="distanceLearningHistory.html">History</a>
      <a class="dl-back-link" href="distanceLearningQuiz.html">&larr; Play</a>
    </div>
  </header>

  <main class="dl-main">
    <h1>Leaderboard</h1>
    <p class="dl-sub">Best single-quiz score per player: overall, and for each round. Top 25.</p>
    <div id="dlLeaderboard"></div>
  </main>

  <script src="distanceLearningStore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore-compat.js"></script>
  <script src="firebaseConfig.js"></script>
  <script src="distanceLearningBoard.js"></script>
  <script>
    // Same tabs as the quiz page's leaderboard: Overall, each open round, Today.
    const tabs = [
      { key: "overall", label: "Overall" },
      { key: "india", label: "India" },
      { key: "world", label: "World" },
      { key: "europe", label: "Europe" },
      { key: "today", label: "Today" },
    ];
    const requested = new URLSearchParams(location.search).get("round");
    const initial = tabs.some((t) => t.key === requested) ? requested : "overall";
    DistanceLearningBoard.renderLeaderboardPanel("dlLeaderboard", tabs, initial, 25);
  </script>
</body>
</html>
