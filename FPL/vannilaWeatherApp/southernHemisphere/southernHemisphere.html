<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Southern Hemisphere Weather — TENFORBEN Station</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="sh-header">
    <div class="sh-brand">TENFORBEN // STATION — Southern Hemisphere</div>
    <div class="sh-header-links">
      <a class="sh-back-link" href="highAltitude/highAltitude.html">High Altitude &rarr;</a>
      <a class="sh-back-link" href="../weatherGame/geoStreakGame.html">GeoStreak</a>
      <a class="sh-back-link" href="../index.html">&larr; Weather.JS</a>
    </div>
  </header>

  <main class="sh-main">
    <p class="sh-sub">
      Every sovereign country whose capital sits south of the equator.
    </p>
    <p class="sh-count" id="shCount"></p>
    <p class="sh-updated" id="shUpdated"></p>

    <div class="sh-toolbar">
      <button type="button" id="shRefresh" class="sh-btn">&#8635; Refresh</button>
      <button type="button" id="shCompare" class="sh-btn" disabled>&#8646; Compare to last run</button>
      <span class="sh-status" id="shStatus"></span>
    </div>

    <div class="sh-table-wrap">
      <table class="sh-table">
        <thead>
          <tr>
            <th data-sort-key="country">Country</th>
            <th data-sort-key="capital">Capital</th>
            <th class="sh-unsortable">Flag</th>
            <th data-sort-key="map">Map</th>
            <th data-sort-key="temp">Current Temp</th>
            <th data-sort-key="localTime">Local Time</th>
            <th data-sort-key="sunrise">Sunrise</th>
            <th data-sort-key="sunset">Sunset</th>
            <th data-sort-key="dayLength">Day Length</th>
          </tr>
        </thead>
        <tbody id="shBody">
          <tr>
            <td colspan="9" class="sh-loading">Loading countries&hellip;</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
