<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assembly Weather — TENFORBEN Station</title>
  <link rel="stylesheet" href="../../style.css" />
  <style>
    /* Home page for the assembly weather pages: one card per assembly,
       summarised from that assembly's own seats.json + weatherData.json. */
    .aw-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
      margin-top: 22px;
    }
    .aw-card {
      display: block;
      background: #0a1226;
      border: 1px solid #1b2a4a;
      border-radius: 10px;
      padding: 18px 20px;
      color: inherit;
      text-decoration: none;
      transition: border-color 0.15s, background 0.15s;
    }
    .aw-card:hover { border-color: #1f6feb; background: #0c1630; }
    .aw-state {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.72rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #6b7fa8;
    }
    .aw-name { font-size: 1.25rem; color: #e6f2ff; margin: 4px 0 2px; }
    .aw-meta {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.78rem;
      color: #93a4c3;
      margin-bottom: 12px;
    }
    .aw-bar {
      display: flex;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      background: #12244a;
      margin-bottom: 8px;
    }
    .aw-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .aw-pill {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid currentColor;
    }
    .aw-weather {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 0.82rem;
      color: #9db4de;
    }
    .aw-weather b { display: block; font-size: 1.05rem; color: #7dd3fc; font-weight: 600; }
    .aw-weather small { color: #6b7fa8; }
    .aw-foot {
      margin-top: 12px;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.7rem;
      color: #4b5d80;
    }
    .aw-open { float: right; color: #7dd3fc; }
    @media (max-width: 700px) {
      .sh-header { flex-direction: column; align-items: flex-start; gap: 10px; }
      .sh-header-links { flex-wrap: wrap; gap: 10px 14px; }
    }
  </style>
</head>
<body>
  <header class="sh-header">
    <div class="sh-brand">TENFORBEN // STATION — Assembly Weather</div>
    <div class="sh-header-links">
      <a class="sh-back-link" href="../highAltitude.html">&larr; High Altitude</a>
      <a class="sh-back-link" href="../mangalaExpress/mangalaExpress.html">Mangala Lakshadweep Express</a>
      <a class="sh-back-link" href="../coromandelExpress/coromandelExpress.html">Coromandel Express</a>
      <a class="sh-back-link" href="../../../weatherGame/geoStreakGame.html">GeoStreak</a>
      <a class="sh-back-link" href="../../../index.html">&larr; Weather.JS</a>
    </div>
  </header>

  <main class="sh-main">
    <p class="sh-sub">Legislative assemblies, seat by seat: who won each constituency, and the weather there now.</p>
    <p class="sh-count" id="awCount"></p>
    <div class="aw-grid" id="awGrid"></div>
  </main>

  <script>
    // ADDING AN ASSEMBLY: give it its own folder next to keralaAssembly/
    // (its HTML sets window.ASSEMBLY and loads ../shared/assembly.js) with
    // the same seats.json / weatherData.json shape, then add an entry here.
    const ASSEMBLIES = [
      {
        state: "Kerala",
        name: "Kerala Legislative Assembly",
        result: "2026 result",
        href: "keralaAssembly/keralaAssembly.html",
        seats: "keralaAssembly/seats.json",
        weather: "keralaAssembly/weatherData.json",
        alliances: { UDF: "#60a5fa", LDF: "#f87171", NDA: "#fb923c" },
      },
      {
        state: "Tamil Nadu",
        name: "Tamil Nadu Legislative Assembly",
        result: "2026 result",
        href: "tamilNaduAssembly/tamilNaduAssembly.html",
        seats: "tamilNaduAssembly/seats.json",
        weather: "tamilNaduAssembly/weatherData.json",
        alliances: { TVK: "#facc15", SPA: "#f87171", "AIADMK+": "#4ade80" },
      },
      {
        state: "Chhattisgarh",
        name: "Chhattisgarh Legislative Assembly",
        result: "2023 result",
        href: "chhattisgarhAssembly/chhattisgarhAssembly.html",
        seats: "chhattisgarhAssembly/seats.json",
        weather: "chhattisgarhAssembly/weatherData.json",
        alliances: { BJP: "#fb923c", INC: "#60a5fa", GGP: "#a78bfa" },
      },
      {
        state: "Jammu & Kashmir",
        name: "Jammu and Kashmir Legislative Assembly",
        result: "2024 result",
        href: "jammuKashmirAssembly/jammuKashmirAssembly.html",
        seats: "jammuKashmirAssembly/seats.json",
        weather: "jammuKashmirAssembly/weatherData.json",
        alliances: { INDIA: "#60a5fa", BJP: "#fb923c", PDP: "#2dd4bf", Others: "#93a4c3" },
      },
      {
        state: "Karnataka",
        name: "Karnataka Legislative Assembly",
        result: "2023 result",
        href: "karnatakaAssembly/karnatakaAssembly.html",
        seats: "karnatakaAssembly/seats.json",
        weather: "karnatakaAssembly/weatherData.json",
        alliances: { "INC": "#60a5fa", "BJP": "#fb923c", "JD(S)": "#4ade80", "Others": "#93a4c3" },
      },
      {
        state: "Andhra Pradesh",
        name: "Andhra Pradesh Legislative Assembly",
        result: "2024 result",
        href: "andhraPradeshAssembly/andhraPradeshAssembly.html",
        seats: "andhraPradeshAssembly/seats.json",
        weather: "andhraPradeshAssembly/weatherData.json",
        alliances: { "NDA": "#facc15", "YSRCP": "#2dd4bf" },
      },
      {
        state: "Telangana",
        name: "Telangana Legislative Assembly",
        result: "2023 result",
        href: "telanganaAssembly/telanganaAssembly.html",
        seats: "telanganaAssembly/seats.json",
        weather: "telanganaAssembly/weatherData.json",
        alliances: { "INC+": "#60a5fa", "BRS": "#f472b6", "NDA": "#fb923c", "AIMIM": "#4ade80" },
      },
      {
        state: "Maharashtra",
        name: "Maharashtra Legislative Assembly",
        result: "2024 result",
        href: "maharashtraAssembly/maharashtraAssembly.html",
        seats: "maharashtraAssembly/seats.json",
        weather: "maharashtraAssembly/weatherData.json",
        alliances: { "Mahayuti": "#fb923c", "MVA": "#60a5fa", "Others": "#93a4c3" },
      },
      {
        state: "Gujarat",
        name: "Gujarat Legislative Assembly",
        result: "2022 result",
        href: "gujaratAssembly/gujaratAssembly.html",
        seats: "gujaratAssembly/seats.json",
        weather: "gujaratAssembly/weatherData.json",
        alliances: { "BJP": "#fb923c", "INC": "#60a5fa", "AAP": "#2dd4bf", "Others": "#93a4c3" },
      },
      {
        state: "Himachal Pradesh",
        name: "Himachal Pradesh Legislative Assembly",
        result: "2022 result",
        href: "himachalPradeshAssembly/himachalPradeshAssembly.html",
        seats: "himachalPradeshAssembly/seats.json",
        weather: "himachalPradeshAssembly/weatherData.json",
        alliances: { "INC": "#60a5fa", "BJP": "#fb923c", "Others": "#93a4c3" },
      },
      {
        state: "Punjab",
        name: "Punjab Legislative Assembly",
        result: "2022 result",
        href: "punjabAssembly/punjabAssembly.html",
        seats: "punjabAssembly/seats.json",
        weather: "punjabAssembly/weatherData.json",
        alliances: { "AAP": "#2dd4bf", "INC": "#60a5fa", "SAD+": "#facc15", "BJP": "#fb923c", "Others": "#93a4c3" },
      },
      {
        state: "Uttarakhand",
        name: "Uttarakhand Legislative Assembly",
        result: "2022 result",
        href: "uttarakhandAssembly/uttarakhandAssembly.html",
        seats: "uttarakhandAssembly/seats.json",
        weather: "uttarakhandAssembly/weatherData.json",
        alliances: { "BJP": "#fb923c", "INC": "#60a5fa", "Others": "#93a4c3" },
      },
    ];

    const OTHER_COLOR = "#93a4c3";

    function esc(str) {
      return String(str ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function ago(unixSec) {
      if (!unixSec) return "no snapshot yet";
      const mins = Math.round((Date.now() / 1000 - unixSec) / 60);
      if (mins < 60) return `${mins} min ago`;
      if (mins < 60 * 48) return `${Math.round(mins / 60)} h ago`;
      return `${Math.round(mins / 1440)} d ago`;
    }

    async function loadJson(url, fallback) {
      try {
        const res = await fetch(url);
        return res.ok ? await res.json() : fallback;
      } catch (e) {
        return fallback;
      }
    }

    async function cardHtml(a) {
      const [seats, weather] = await Promise.all([
        loadJson(a.seats, []),
        loadJson(a.weather, { generatedAt: null, byNo: {} }),
      ]);

      const counts = {};
      seats.forEach((s) => { counts[s.alliance] = (counts[s.alliance] || 0) + 1; });
      const order = Object.keys(counts).sort((x, y) => counts[y] - counts[x]);
      const colorOf = (k) => a.alliances[k] || OTHER_COLOR;

      const bar = order.map((k) =>
        `<span style="width:${(counts[k] / seats.length) * 100}%;background:${colorOf(k)}" title="${esc(k)} ${counts[k]}"></span>`).join("");
      const pills = order.map((k) =>
        `<span class="aw-pill" style="color:${colorOf(k)}">${esc(k)} ${counts[k]}</span>`).join("");

      // Warmest / coolest seat in the committed snapshot.
      const temps = seats
        .map((s) => ({ s, t: weather.byNo && weather.byNo[s.no] ? weather.byNo[s.no].temp : null }))
        .filter((x) => typeof x.t === "number");
      let weatherHtml = `<div class="aw-weather"><div><small>No weather snapshot yet</small></div></div>`;
      if (temps.length) {
        temps.sort((p, q) => q.t - p.t);
        const hot = temps[0];
        const cold = temps[temps.length - 1];
        const avg = temps.reduce((sum, x) => sum + x.t, 0) / temps.length;
        weatherHtml = `<div class="aw-weather">
          <div><small>Warmest</small><b>${Math.round(hot.t)}°C</b>${esc(hot.s.constituency)}</div>
          <div><small>Coolest</small><b>${Math.round(cold.t)}°C</b>${esc(cold.s.constituency)}</div>
          <div><small>Average</small><b>${avg.toFixed(1)}°C</b>across ${temps.length} seats</div>
        </div>`;
      }

      return `<a class="aw-card" href="${esc(a.href)}">
        <div class="aw-state">${esc(a.state)}</div>
        <div class="aw-name">${esc(a.name)}</div>
        <div class="aw-meta">${seats.length} seats · ${esc(a.result)}</div>
        <div class="aw-bar">${bar}</div>
        <div class="aw-pills">${pills}</div>
        ${weatherHtml}
        <div class="aw-foot">Snapshot from ${ago(weather.generatedAt)}<span class="aw-open">Open &rarr;</span></div>
      </a>`;
    }

    (async () => {
      document.getElementById("awCount").textContent =
        `${ASSEMBLIES.length} ${ASSEMBLIES.length === 1 ? "assembly" : "assemblies"}`;
      const cards = await Promise.all(ASSEMBLIES.map(cardHtml));
      document.getElementById("awGrid").innerHTML = cards.join("");
    })();
  </script>
</body>
</html>
